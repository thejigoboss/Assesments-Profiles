<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2742; --ink-soft:#4B5F75; --paper:#EAF0F6; --card:#fff; --line:#D6DFE9; --accent:#1F5FBF;
  --red:#D92D20; --red-bg:#FDE8E6; --red-tx:#8E1B12;
  --yel:#F4B400; --yel-bg:#FEF2C4; --yel-tx:#6B4300;
  --grn:#169B4B; --grn-bg:#D9F4E3; --grn-tx:#0B5A2B;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:var(--body);color:var(--ink);line-height:1.5;min-height:100vh;
  background:radial-gradient(900px 420px at 90% 120px,rgba(31,95,191,.10),transparent 70%),radial-gradient(700px 380px at 0% 480px,rgba(244,180,0,.09),transparent 70%),var(--paper)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header ---------- */
header{position:relative;overflow:hidden;color:#fff;padding:26px 20px 74px;
  background:linear-gradient(120deg,#0B1F36,#173F66,#0B1F36);background-size:220% 220%;animation:drift 16s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#sky{position:absolute;left:0;bottom:0;width:100%;height:60px;pointer-events:none}
.win{fill:#F4B400;opacity:.1;animation:tw 6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.9}}
.wrap{max-width:1040px;margin:0 auto;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:nowrap}
.brand{min-width:0}
.brand{display:flex;align-items:center;gap:14px;animation:rise .8s var(--ease) backwards}
.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#F4B400,#FF8A3D);display:grid;place-items:center;color:#2A1A00;box-shadow:0 8px 20px rgba(244,180,0,.35);animation:float 4s ease-in-out infinite}
.logo svg{width:27px;height:27px}
@keyframes float{50%{transform:translateY(-4px) rotate(-3deg)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.5vw,38px);letter-spacing:-.02em;line-height:1.05}
.sub{color:#BFD0E0;font-size:14.5px;margin-top:3px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;animation:rise .8s .2s var(--ease) backwards}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:#D3DEE9;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.sync i{width:9px;height:9px;border-radius:50%;background:#4ADE80;display:inline-block}
.sync.busy i{background:var(--yel);animation:pulse 1s infinite}
.sync.err i{background:#FF7A70}
@keyframes pulse{50%{opacity:.25}}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(15,39,66,.22)}
.btn:active{transform:scale(.97)}
.btn-light{background:#fff;color:var(--ink)}
.btn-light:hover{background:#E3ECF6}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#184E9E}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--paper)}
.owner-badge{background:#DDF7E8;color:#0B5A2B;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.lockbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:background .2s,transform .15s}
.lockbtn:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.lockbtn:active{transform:scale(.94)}
.lockbtn svg{width:18px;height:18px}
body.owner .lockbtn{background:#DDF7E8;color:#0B5A2B;border-color:#DDF7E8}

main{max-width:1040px;margin:0 auto;padding:0 20px 60px}

/* ---------- New tab bar (floating segmented control) ---------- */
.tabs{position:sticky;top:12px;z-index:20;display:flex;gap:4px;padding:6px;margin:-30px 0 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:20px;box-shadow:0 14px 34px rgba(15,39,66,.2),0 0 0 1px rgba(15,39,66,.05)}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:0;border-radius:15px;background:linear-gradient(135deg,#143A63,#0F2742);box-shadow:0 8px 18px rgba(15,39,66,.35);transition:left .4s var(--ease),width .4s var(--ease)}
.tab{position:relative;z-index:1;flex:1;background:none;border:0;padding:13px 12px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;gap:9px;align-items:center;justify-content:center;border-radius:15px;transition:color .25s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:#fff}
.tab[aria-selected=true] .i{animation:tabpop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes tabpop{from{transform:scale(.6) rotate(-12deg)}to{transform:none}}
.tab .n{background:#E3EAF2;color:var(--ink);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;transition:background .25s,color .25s}
.tab[aria-selected=true] .n{background:rgba(255,255,255,.2);color:#fff}
.tab[data-tab=pay] .n{background:var(--yel);color:#3F2A00}

/* ---------- Toolbar ---------- */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);width:18px;height:18px}
.search input{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 42px;min-height:48px;transition:box-shadow .2s,border-color .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,95,191,.16);outline:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:all .2s var(--ease)}
.chip:hover{transform:translateY(-2px);border-color:var(--ink-soft)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 14px rgba(15,39,66,.28)}
.paynote{display:flex;gap:10px;align-items:center;background:var(--yel-bg);color:var(--yel-tx);border-radius:14px;padding:12px 16px;font-weight:600;font-size:14.5px;margin-bottom:14px;animation:in .45s var(--ease) backwards}
.demo{background:var(--yel-bg);color:var(--yel-tx);font-weight:600;font-size:14px;padding:10px 14px;border-radius:12px;margin-bottom:14px}

/* ---------- Site cards ---------- */
.head,.row{display:grid;grid-template-columns:52px minmax(0,1fr) 190px 90px 96px;gap:14px;align-items:center;padding:0 16px}
.head{font-size:13px;font-weight:700;color:var(--ink-soft);padding-bottom:8px}
.row{--c:var(--line);background:var(--card);border-radius:16px;min-height:76px;margin-bottom:10px;
  box-shadow:inset 6px 0 0 var(--c),0 1px 3px rgba(15,39,66,.08);animation:in .5s var(--ease) backwards;transition:opacity .3s,transform .25s,box-shadow .25s}
.row.noanim{animation:none}
.row:hover{box-shadow:inset 6px 0 0 var(--c),0 12px 26px rgba(15,39,66,.14);transform:translateY(-2px)}
.row.s-pending{--c:var(--red)} .row.s-billed{--c:var(--yel)} .row.s-done{--c:var(--grn)}
.row.leaving{opacity:0;transform:translateX(40px)}
.row.flash{animation:flash 1.1s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:#CFE3FF;transform:scale(1.015)}100%{background:var(--card);transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-left:6px;transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.row:hover .tile{transform:rotate(-8deg) scale(1.08)}
.tile svg{width:24px;height:24px}
.s-pending .tile{background:var(--red-bg);color:var(--red-tx)}
.s-billed .tile{background:var(--yel-bg);color:var(--yel-tx)}
.s-done .tile{background:var(--grn-bg);color:var(--grn-tx)}
.name{font-weight:700;font-size:16.5px;overflow-wrap:anywhere;line-height:1.3}
.type{font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.date{font-size:13.5px;color:var(--ink-soft);font-weight:600}
.type{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uchip{background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 10px;font-weight:700;font-size:12.5px}
.rem{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-soft);margin-top:4px;font-weight:500}
.rem svg{width:14px;height:14px;margin-top:3px}
.rem span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.badge,.sel{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;border:0;white-space:nowrap}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.s-pending .badge::before{animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(217,45,32,.55)}70%,100%{box-shadow:0 0 0 7px rgba(217,45,32,0)}}
.s-pending .badge,.s-pending .sel{background:var(--red-bg);color:var(--red-tx)}
.s-billed .badge,.s-billed .sel{background:var(--yel-bg);color:var(--yel-tx)}
.s-done .badge,.s-done .sel{background:var(--grn-bg);color:var(--grn-tx)}
.sel{cursor:pointer;padding-right:8px;border:2px solid currentColor}
.rowact{display:none;gap:6px;justify-content:flex-end}
body.owner .rowact{display:flex}
.ico{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .15s}
.ico:hover{background:var(--paper);transform:scale(1.1)}
.ico.del:hover{background:var(--red-bg);border-color:var(--red)}
.ico svg{width:17px;height:17px}
.empty{text-align:center;padding:52px 20px;background:var(--card);border-radius:18px;color:var(--ink-soft);animation:in .5s backwards}
.empty .em{width:60px;height:60px;border-radius:50%;background:var(--paper);display:grid;place-items:center;margin:0 auto 12px;color:var(--ink-soft)}
.empty .em svg{width:28px;height:28px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:4px}
.skeleton{height:76px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,#E0E7EF 25%,#F3F6F9 50%,#E0E7EF 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* floating add button */
.fab{position:fixed;right:24px;bottom:24px;z-index:25;display:none;align-items:center;gap:8px;border:0;cursor:pointer;color:#fff;font-weight:800;padding:15px 22px;border-radius:999px;background:linear-gradient(135deg,#2B73E0,#1749A0);box-shadow:0 14px 30px rgba(31,95,191,.5);transition:transform .2s}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab:active{transform:scale(.95)}
.fab svg{width:20px;height:20px;transition:transform .3s}
.fab:hover svg{transform:rotate(90deg)}
body.owner:not(.is-dash) .fab{display:flex;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}

/* ---------- Dashboard ---------- */
.ai{animation:in .55s var(--ease) backwards}
.alert{display:flex;width:100%;align-items:center;gap:14px;text-align:left;border:0;cursor:pointer;background:linear-gradient(100deg,#FFE27A,#F4B400);color:#3F2A00;border-radius:18px;padding:16px 20px;margin-bottom:14px;font-weight:700;box-shadow:0 10px 24px rgba(244,180,0,.35);transition:transform .2s}
.alert:hover{transform:translateY(-3px)}
.alert .ab{width:44px;height:44px;border-radius:14px;background:rgba(63,42,0,.12);display:grid;place-items:center;flex:none;animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(12deg)}30%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}}
.alert small{display:block;font-weight:600;opacity:.8;font-size:13.5px}
.alert .go{margin-left:auto;font-size:14px;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{position:relative;overflow:hidden;border-radius:20px;padding:20px;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-5px)}
.stat .si{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px}
.stat .si svg{width:22px;height:22px}
.stat .wm{position:absolute;right:-18px;top:-14px;width:130px;height:130px;opacity:.13;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--ease)}
.stat:hover .wm{transform:rotate(-10deg) scale(1.1)}
.stat b{font-family:var(--display);font-size:46px;font-weight:800;display:block;line-height:1}
.stat small{font-size:14.5px;font-weight:700;display:block;margin-top:4px}
.sbar{height:7px;border-radius:99px;margin-top:14px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s var(--ease)}
.stat.p{background:linear-gradient(140deg,#E8483B,#B8271C);color:#fff;box-shadow:0 12px 26px rgba(217,45,32,.35)}
.stat.b{background:linear-gradient(140deg,#FFD84A,#F2B000);color:#3F2A00;box-shadow:0 12px 26px rgba(244,180,0,.4)}
.stat.c{background:linear-gradient(140deg,#25B862,#0F8040);color:#fff;box-shadow:0 12px 26px rgba(22,155,75,.35)}
.stat.p .si,.stat.c .si{background:rgba(255,255,255,.22)}
.stat.b .si{background:rgba(63,42,0,.12)}
.stat.p .sbar,.stat.c .sbar{background:rgba(255,255,255,.28)} .stat.p .sbar i,.stat.c .sbar i{background:#fff}
.stat.b .sbar{background:rgba(63,42,0,.16)} .stat.b .sbar i{background:#3F2A00}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;margin-top:14px}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(15,39,66,.08)}
.card h3{font-family:var(--display);font-size:19px;margin-bottom:16px}
.donut-wrap{position:relative;width:200px;height:200px;margin:0 auto 18px}
.donut-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-wrap circle{fill:none;stroke-width:14;transition:stroke-dasharray 1.2s var(--ease)}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-center b{font-family:var(--display);font-size:42px;font-weight:800;line-height:1}
.donut-center span{font-size:13px;color:var(--ink-soft);font-weight:700}
.legend{list-style:none;padding:0;display:grid;gap:9px}
.legend li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
.legend i{width:12px;height:12px;border-radius:4px}
.legend span{margin-left:auto;color:var(--ink-soft)}
.dot-p,.tbar .p{background:var(--red)} .dot-b,.tbar .b{background:var(--yel)} .dot-c,.tbar .c{background:var(--grn)}
.trow{margin-bottom:20px}
.trow:last-child{margin-bottom:0}
.tl{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tl .tile{width:36px;height:36px;margin:0;border-radius:11px;background:var(--paper);color:var(--ink)}
.tl .tile svg{width:19px;height:19px}
.tl b{font-size:15.5px}
.tl small{margin-left:auto;color:var(--ink-soft);font-weight:700}
.tbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px}
.tbar i{display:block;height:100%;width:0;transition:width 1s var(--ease)}
.mini{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.mini span{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px}
.mini .p{background:var(--red-bg);color:var(--red-tx)} .mini .b{background:var(--yel-bg);color:var(--yel-tx)} .mini .c{background:var(--grn-bg);color:var(--grn-tx)}
.recent{margin-top:14px}
.rc{display:grid;grid-template-columns:44px minmax(0,1fr) auto 52px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rc.first{border-top:0}
.rc .tile{width:42px;height:42px;margin:0}
.rc .name{font-size:15.5px}
.rc .date{text-align:right}
.rc.s-pending .badge{background:var(--red-bg);color:var(--red-tx)}
.rc.s-billed .badge{background:var(--yel-bg);color:var(--yel-tx)}
.rc.s-done .badge{background:var(--grn-bg);color:var(--grn-tx)}
.rc.s-pending .tile{background:var(--red-bg);color:var(--red-tx)} .rc.s-billed .tile{background:var(--yel-bg);color:var(--yel-tx)} .rc.s-done .tile{background:var(--grn-bg);color:var(--grn-tx)}
.rc .badge{font-size:13px;padding:5px 11px}

/* ---------- Dialog ---------- */
dialog{border:0;border-radius:22px;padding:26px;width:min(430px,92vw);box-shadow:0 28px 70px rgba(15,39,66,.4);margin:auto}
dialog[open]{animation:dlg .3s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{background:rgba(15,39,66,.6);backdrop-filter:blur(3px)}
@keyframes dlg{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
dialog h2{font-family:var(--display);font-size:25px;margin-bottom:6px}
dialog label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
dialog input,dialog select,dialog textarea{width:100%;resize:vertical;font:inherit;border:1px solid #9AA9B8;border-radius:12px;padding:12px;background:#fff}
dialog input:focus,dialog select:focus,dialog textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,95,191,.16)}
.dlg-act{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.err{color:var(--red-tx);font-size:14px;font-weight:600;margin-top:8px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Mobile: bottom navigation bar ---------- */
@media (max-width:760px){
  main{padding-bottom:110px}
  header{padding-bottom:70px}
  .logo{width:40px;height:40px;border-radius:12px}
  .logo svg{width:22px;height:22px}
  h1{font-size:22px}
  .sub{display:none}
  .sync span{display:none}
  .sync{padding:11px}
  .owner-badge{display:none}
  .tabs{position:fixed;top:auto;bottom:12px;left:12px;right:12px;margin:0;padding:6px;border-radius:22px}
  .tab{flex-direction:column;gap:3px;padding:9px 4px;font-size:12.5px}
  .tab .n{position:absolute;top:2px;left:calc(50% + 6px);font-size:11px;padding:0 6px}
  .head{display:none}
  .row{grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;padding:14px 14px 14px 8px}
  .status{grid-column:1/-1}
  .rowact{grid-column:1/-1;justify-content:flex-start}
  .row:hover{transform:none}
  .fab{right:16px;bottom:96px;padding:14px 18px}
  .toast{bottom:96px}
  .dgrid{gap:8px}
  .stat{padding:14px}
  .stat .si{width:34px;height:34px;margin-bottom:8px}
  .stat b{font-size:30px}
  .stat small{font-size:12.5px}
  .stat .wm{width:90px;height:90px}
  .two{grid-template-columns:1fr}
  .rc{grid-template-columns:42px minmax(0,1fr) auto}
  .rc .date{display:none}
  .alert{padding:14px}
  .alert .go{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <svg id="sky" viewBox="0 0 1000 80" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <div class="wrap top">
    <div class="brand">
      <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6M9 11h.01M15 11h.01"/></svg></div>
      <div>
        <h1>Assessment Profile</h1>
        <p class="sub">Site assessment records, live from Google Sheets</p>
      </div>
    </div>
    <div class="actions">
      <div class="sync" id="sync"><i></i><span id="syncTxt">Loading…</span></div>
      <button class="lockbtn" id="ownerBtn" aria-label="Owner login" title="Owner login"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></button>
    </div>
  </div>

      <svg class="i" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>
      <span class="tx">Payment Pending</span><span class="n" id="cPay">0</span></button>
    <button class="tab" role="tab" data-tab="dash" aria-selected="false">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span class="tx">Dashboard</span></button>

  <div class="demo" id="demoNote" hidden>Demo mode: changes are not saved. Connect your Google Sheet using the setup steps to go live.</div>

  <section id="listView">
    <div class="tools">
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search site name" aria-label="Search site name"></label>
    </div>
    <div class="paynote" id="payNote" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>These sites have a bill generated and are waiting to be marked Completed.</div>
    <div class="head"><span></span><span>Site</span><span>Category</span><span>Updated</span><span></span></div>
    <div id="list"></div>
  </section>

  <section id="dash" hidden aria-label="Dashboard"></section>
</main>

<button class="fab" id="addBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add site</button>

<dialog id="siteDlg">
  <form method="dialog" id="siteForm">
    <h2 id="siteTitle">Add site</h2>
    <label for="fName">Site name</label>
    <input id="fName" required maxlength="80" autocomplete="off">
    <label for="fTypeIn">Type</label>
    <select id="fTypeIn"><option>Flat</option><option>Duplex</option><option>Commercial</option></select>

      <button type="button" class="btn btn-ghost" data-close>Cancel</button>

</dialog>

<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <h2>Owner login</h2>
    <label for="pass">Passcode</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <div class="dlg-act">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Unlock editing</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   SETUP: paste your Google Apps Script Web App URL below.
   Leave empty to try the app in demo mode.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzB2Ad05ATvloCaeoSLdjxBCfvSEpyWWgFvFSb6pLvjHTCLqnsOCz8RyWiGtBJSinI4/exec';
const REFRESH_MS = 60000;

const STATUS = {
  'Pending File':   {cls:'s-pending', k:'p'},
  'Bill Generated': {cls:'s-billed',  k:'b'},
  'Completed':      {cls:'s-done',    k:'c'}
};
const TYPES = ['Flat','Duplex','Commercial'];
const ICON = {
  Flat:'<path d="M5 21V4h9v17M14 9h5v12M8 8h2M8 12h2M8 16h2M3 21h18"/>',
  Duplex:'<path d="M3 11l9-7 9 7M5 10v11h14V10M10 21v-6h4v6"/>',
  Commercial:'<path d="M3 9l1.5-5h15L21 9M3 9h18M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0M5 12v9h14v-9M10 21v-5h4v5"/>'
};
const tIcon = t => `<svg class="i" viewBox="0 0 24 24">${ICON[t]||ICON.Flat}</svg>`;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LOCK_SVG='<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
const UNLOCK_SVG='<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.5-2"/></svg>';
let rows = [], tab = 'all', ftype = '', passcode = '', firstRender = true, editId = null;
const DEMO = !API_URL;

if (DEMO) {
  const d = n => new Date(Date.now() - n * 864e5).toISOString();
  rows = [
    {id:'a1',name:'Shanti Residency – Block A',type:'Flat',status:'Pending File',updated:d(1),units:24,remarks:'Documents awaited from society'},
    {id:'a2',name:'Green Park Villa 12',type:'Duplex',status:'Bill Generated',updated:d(2)},
    {id:'a3',name:'City Centre Mall – Shop 4',type:'Commercial',status:'Completed',updated:d(4)},
    {id:'a4',name:'Lake View Apartments 3B',type:'Flat',status:'Bill Generated',updated:d(3)},
    {id:'a5',name:'Rose Lane Duplex 7',type:'Duplex',status:'Pending File',updated:d(0)},
    {id:'a6',name:'Metro Plaza – Office 201',type:'Commercial',status:'Bill Generated',updated:d(6)},
    {id:'a7',name:'Sunrise Heights 5A',type:'Flat',status:'Completed',updated:d(8)}
  ];
  $('#demoNote').hidden = false;
}

/* ---------- Header skyline ---------- */
(function(){
  const B=[[0,60,34],[70,40,52],[120,70,40],[200,45,64],[255,80,44],[345,50,58],[405,65,36],[480,45,68],[535,75,46],[620,50,56],[680,70,38],[760,45,62],[815,80,42],[905,50,54],[965,40,36]];
  let s='';
  B.forEach(([x,w,h])=>{
    s+=`<rect x="${x}" y="${80-h}" width="${w}" height="${h}" fill="#1B3F63"/>`;
    for(let wx=x+6; wx<x+w-6; wx+=12) for(let wy=80-h+6; wy<74; wy+=12)
      if(Math.random()<.38) s+=`<rect class="win" x="${wx}" y="${wy}" width="5" height="6" rx="1" style="animation-delay:${(Math.random()*6).toFixed(2)}s"/>`;
  });
  $('#sky').innerHTML=s;
})();

/* ---------- API ---------- */
function setSync(state, txt){ const el=$('#sync'); el.className='sync '+state; $('#syncTxt').textContent=txt; }
async function load(){
  if (DEMO) { setSync('', 'Demo data'); render(true); firstRender=false; return; }
  setSync('busy', 'Syncing…');
  try {
    const r = await fetch(API_URL, {cache:'no-store'});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    rows = j.rows;
    setSync('', 'Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    const first = firstRender; firstRender = false;
    render(first);
  } catch(e) {
    setSync('err', 'Offline – retrying');
    if (firstRender) $('#list').innerHTML = emptyBox('Could not load data','Check the Web App URL and that access is set to Anyone.');
  }
}
async function call(action, data){
  if (DEMO) return {ok:true};
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, passcode, ...data})});
  return r.json();
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ---------- Helpers ---------- */
function countUp(el, to, anim){
  if (!anim || matchMedia('(prefers-reduced-motion:reduce)').matches) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  (function step(t){
    const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = Math.round(to*e);
    if (k<1) requestAnimationFrame(step);
  })(t0);
}
function fmt(iso){ const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString([], {day:'numeric',month:'short'}); }
const count = fn => rows.filter(fn).length;
const emptyBox = (t,s) => `<div class="empty"><div class="em"><svg class="i" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg></div><b>${t}</b>${s}</div>`;

/* ---------- Render ---------- */
function render(anim){
  $('#cAll').textContent = rows.length;
  $('#cPay').textContent = count(r => r.status==='Bill Generated');
  const isDash = tab === 'dash';
  document.body.classList.toggle('is-dash', isDash);
  $('#listView').hidden = isDash; $('#dash').hidden = !isDash;
  if (isDash) renderDash(anim); else renderList(anim);
}

function renderList(anim){
  const q=$('#q').value.trim().toLowerCase();
  const order={'Pending File':0,'Bill Generated':1,'Completed':2};
  $('#payNote').hidden = tab!=='pay';
  const view = rows.filter(r =>
    (tab==='all' || r.status==='Bill Generated') && (!ftype || r.type===ftype) && (!q || String(r.name).toLowerCase().includes(q))
  ).sort((a,b) => tab==='all'
    ? order[a.status]-order[b.status] || String(b.updated).localeCompare(String(a.updated))
    : String(a.updated).localeCompare(String(b.updated)));

  const list=$('#list');
  if (!view.length) {
    list.innerHTML = tab==='pay'
      ? emptyBox('No payments pending','Sites with a generated bill that are not completed will show here.')
      : emptyBox('No sites found', rows.length ? 'Try a different search or type.' : 'The owner can add the first site.');
    return;
  }
  const owner = document.body.classList.contains('owner');
  list.innerHTML = view.map((r,i) => {
    const s = STATUS[r.status] || STATUS['Pending File'];
    const opts = Object.keys(STATUS).map(k=>`<option ${k===r.status?'selected':''}>${k}</option>`).join('');
    return `<div class="row ${s.cls} ${anim?'':'noanim'}" data-id="${esc(r.id)}" style="animation-delay:${Math.min(i,12)*45}ms">
      <div class="tile">${tIcon(r.type)}</div>
      <div class="info"><div class="name">${esc(r.name)}</div><div class="type">${esc(r.type)}${r.units?`<span class="uchip">${esc(r.units)} ${Number(r.units)===1?'unit':'units'}</span>`:''}</div>${r.remarks?`<div class="rem" title="${esc(r.remarks)}"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg><span>${esc(r.remarks)}</span></div>`:''}</div>
      <div class="status">${owner
        ? `<select class="sel" aria-label="Category for ${esc(r.name)}">${opts}</select>`
        : `<span class="badge">${esc(r.status)}</span>`}</div>
      <div class="date">${fmt(r.updated)}</div>
      <div class="rowact">
        <button class="ico" data-edit aria-label="Edit ${esc(r.name)}"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="ico del" data-del aria-label="Delete ${esc(r.name)}"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      </div>
    </div>`;
  }).join('');
}

function renderDash(anim){
  const tot = rows.length;
  const n = {p:count(r=>r.status==='Pending File'), b:count(r=>r.status==='Bill Generated'), c:count(r=>r.status==='Completed')};
  const pct = v => tot ? Math.round(v/tot*100) : 0;
  const C = 2*Math.PI*48;
  const segs = [[n.p,'#D92D20'],[n.b,'#F4B400'],[n.c,'#169B4B']];
  const multi = segs.filter(s=>s[0]>0).length > 1;
  let off=0, circles='<circle cx="60" cy="60" r="48" stroke="#E3E9EF"/>';
  segs.forEach(([v,col])=>{
    if(!v) return;
    const len=v/tot*C, dash=Math.max(len-(multi?3:0),.5);
    circles += `<circle cx="60" cy="60" r="48" stroke="${col}" stroke-dashoffset="${-off}" data-d="${dash} ${C-dash}" style="stroke-dasharray:${anim?`0 ${C}`:`${dash} ${C-dash}`}"/>`;
    off+=len;
  });
  const dl = ms => anim ? `animation-delay:${ms}ms` : 'animation:none';

  const typeRows = TYPES.map(t=>{
    const all=rows.filter(r=>r.type===t), c={p:0,b:0,c:0};
    all.forEach(r=>{ const s=STATUS[r.status]; if(s) c[s.k]++; });
    const w = k => all.length ? (c[k]/all.length*100)+'%' : '0%';
    const seg = k => `<i class="${k}" data-w="${w(k)}" style="width:${anim?'0%':w(k)}"></i>`;
    return `<div class="trow"><div class="tl"><div class="tile">${tIcon(t)}</div><b>${t}</b><small>${all.length} ${all.length===1?'site':'sites'}, ${all.reduce((a,r)=>a+(Number(r.units)||0),0)} units</small></div>
      <div class="tbar">${seg('p')}${seg('b')}${seg('c')}</div>
      <div class="mini"><span class="p">${c.p} pending</span><span class="b">${c.b} billed</span><span class="c">${c.c} done</span></div></div>`;
  }).join('');

  const recent = rows.slice().sort((a,b)=>String(b.updated).localeCompare(String(a.updated))).slice(0,5).map((r,i)=>{
    const s=STATUS[r.status]||STATUS['Pending File'];
    return `<div class="rc ${s.cls} ${i?'':'first'}"><div class="tile">${tIcon(r.type)}</div><div><div class="name">${esc(r.name)}</div><div class="type">${esc(r.type)}</div></div><span class="badge">${esc(r.status)}</span><span class="date">${fmt(r.updated)}</span></div>`;
  }).join('') || '<p style="color:var(--ink-soft)">No activity yet.</p>';

  const IC = {
    p:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
    b:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
    c:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'
  };
  const stat = (k,label,v,ms) => `<div class="stat ${k} ai" style="${dl(ms)}">
      <svg class="wm" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>
      <div class="si"><svg class="i" viewBox="0 0 24 24">${IC[k]}</svg></div>
      <b data-n="${v}">0</b><small>${label}</small>
      <div class="sbar"><i data-w="${pct(v)}%" style="width:${anim?'0%':pct(v)+'%'}"></i></div></div>`;

  const alert = n.b ? `<button class="alert ai" data-go="pay" style="${dl(0)}">
      <span class="ab"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></span>
      <span>${n.b} ${n.b===1?'bill is':'bills are'} waiting for payment<small>Generated but not marked Completed yet</small></span>
      <span class="go">View list</span></button>` : '';

  $('#dash').innerHTML = `${alert}
    <div class="dgrid">${stat('p','Pending File',n.p,60)}${stat('b','Bill Generated',n.b,140)}${stat('c','Completed',n.c,220)}</div>
    <div class="two">
      <div class="card ai" style="${dl(300)}">
        <h3>Status overview</h3>
        <div class="donut-wrap"><svg viewBox="0 0 120 120" aria-hidden="true">${circles}</svg>
          <div class="donut-center"><b data-n="${tot}">0</b><span>${pct(n.c)}% completed</span></div></div>
        <ul class="legend">
          <li><i class="dot-p"></i>Pending File<span>${n.p} (${pct(n.p)}%)</span></li>
          <li><i class="dot-b"></i>Bill Generated<span>${n.b} (${pct(n.b)}%)</span></li>
          <li><i class="dot-c"></i>Completed<span>${n.c} (${pct(n.c)}%)</span></li>
        </ul>
      </div>
      <div class="card ai" style="${dl(380)}"><h3>By site type</h3>${typeRows}</div>
    </div>
    <div class="card recent ai" style="${dl(460)}"><h3>Recently updated</h3>${recent}</div>`;

  $$('#dash [data-n]').forEach(el=>countUp(el, +el.dataset.n, anim));
  if (anim) setTimeout(()=>{
    $$('#dash [data-d]').forEach(c=>c.style.strokeDasharray=c.dataset.d);
    $$('#dash [data-w]').forEach(e=>e.style.width=e.dataset.w);
  }, 80);
}

/* ---------- Tabs ---------- */
function movePill(){
  const t=document.querySelector('.tab[aria-selected=true]'), p=$('#pill');
  p.style.left=t.offsetLeft+'px'; p.style.width=t.offsetWidth+'px';
}
function setTab(name){
  tab=name;
  $$('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===name));
  movePill(); render(true); scrollTo({top:0,behavior:'smooth'});
}
$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#dash').addEventListener('click', e=>{ const g=e.target.closest('[data-go]'); if(g) setTab(g.dataset.go); });
$('#q').addEventListener('input',()=>render(false));
addEventListener('resize', movePill);

/* ---------- Dialogs ---------- */
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
$('#ownerBtn').addEventListener('click',()=>{
  if (document.body.classList.contains('owner')) { lock(); return; }
  $('#loginErr').textContent=''; $('#pass').value=''; $('#loginDlg').showModal(); $('#pass').focus();
});
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const p=$('#pass').value;
  if (DEMO) { passcode=p; unlock(); $('#loginDlg').close(); return; }
  $('#loginErr').textContent='Checking…';
  try {
    passcode=p;
    const j=await call('verify',{});
    if(!j.ok){ passcode=''; $('#loginErr').textContent='Wrong passcode. Try again.'; return; }
    unlock(); $('#loginDlg').close();
  } catch(err){ passcode=''; $('#loginErr').textContent='Could not reach the sheet. Check your connection.'; }
});
function unlock(){
  document.body.classList.add('owner');
  $('#ownerBtn').innerHTML=UNLOCK_SVG; $('#ownerBtn').title='Lock editing'; $('#ownerBtn').setAttribute('aria-label','Lock editing');
  $('.actions').insertAdjacentHTML('afterbegin','<span class="owner-badge" id="ob">Editing</span>');
  render(false); toast('Editing enabled');
}
function lock(){
  document.body.classList.remove('owner'); passcode='';
  $('#ownerBtn').innerHTML=LOCK_SVG; $('#ownerBtn').title='Owner login'; $('#ownerBtn').setAttribute('aria-label','Owner login'); $('#ob')?.remove(); render(false); toast('Editing locked');
}

function openSite(r){
  editId = r ? r.id : null;
  $('#siteTitle').textContent = r ? 'Edit site' : 'Add site';
  $('#fName').value = r ? r.name : '';
  $('#fTypeIn').value = r ? r.type : 'Flat';
  $('#fStatus').value = r ? r.status : 'Pending File';
  $('#fUnits').value = r && r.units ? r.units : '';
  $('#fRemarks').value = r ? (r.remarks || '') : '';
  $('#siteDlg').showModal(); $('#fName').focus();
}
$('#addBtn').addEventListener('click',()=>openSite(null));
$('#siteForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const rec={name:$('#fName').value.trim(), type:$('#fTypeIn').value, status:$('#fStatus').value, units:parseInt($('#fUnits').value,10), remarks:$('#fRemarks').value.trim()};
  if(!rec.name || !(rec.units>=1)) return;
  $('#siteDlg').close();
  await save(editId?'update':'add', editId?{id:editId,...rec}:{id:'S'+Date.now().toString(36),...rec});
});

async function save(action, rec){
  const prev=JSON.stringify(rows), now=new Date().toISOString();
  if(action==='add') rows.push({...rec,updated:now});
  if(action==='update') rows=rows.map(r=>r.id===rec.id?{...r,...rec,updated:now}:r);
  if(action==='delete') rows=rows.filter(r=>r.id!==rec.id);
  render(false);
  if(action!=='delete') flash(rec.id);
  setSync('busy','Saving…');
  try {
    const j=await call(action,rec);
    if(!j.ok) throw new Error(j.error);
    setSync('', DEMO?'Demo data':'Saved'); toast(action==='delete'?'Site deleted':'Saved');
  } catch(e){
    rows=JSON.parse(prev); render(false); setSync('err','Save failed'); toast('Could not save. Changes were undone.');
  }
}
function flash(id){
  const el=document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if(el){ el.classList.remove('flash','noanim'); void el.offsetWidth; el.classList.add('flash'); }
}

/* ---------- Row actions ---------- */
$('#list').addEventListener('change', e=>{
  if(!e.target.classList.contains('sel')) return;
  const row=e.target.closest('.row'), id=row.dataset.id, status=e.target.value;
  if(tab==='pay' && status!=='Bill Generated'){ row.classList.add('leaving'); setTimeout(()=>save('update',{id,status}),300); }
  else save('update',{id,status});
});
$('#list').addEventListener('click', e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const r=rows.find(x=>x.id===row.dataset.id); if(!r) return;
  if(e.target.closest('[data-edit]')) openSite(r);
  if(e.target.closest('[data-del]') && confirm('Delete "'+r.name+'"? This removes it from the sheet.')){
    row.classList.add('leaving'); setTimeout(()=>save('delete',{id:r.id}),300);
  }
});
